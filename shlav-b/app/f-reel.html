<style>
/* Reel: the scrubbable animated walkthrough, same visual language as the first interactive app (RTL) */
.rl{display:grid;grid-template-rows:auto 1fr auto;gap:12px;height:calc(100dvh - 150px);min-height:560px}
.rl .rtop{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.rl .stage{min-height:0;display:grid;grid-template-columns:minmax(0,0.95fr) minmax(0,1.25fr);gap:24px}
.rl .copy{min-width:0;overflow-y:auto;padding-inline-end:4px;display:flex;flex-direction:column;gap:12px}
.rl .eyebrow{font-family:var(--f-mono);font-size:.74rem;letter-spacing:.06em;color:var(--teal)}
.rl .copy h1{font-weight:800;font-size:clamp(1.6rem,3.2vw,2.5rem);line-height:1.08;margin:0;text-wrap:balance}
.rl .lede{color:var(--muted);margin:0;max-width:60ch}
.rl .points{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.rl .points li{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;padding:9px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line);opacity:.18;transform:translateY(6px);transition:opacity .35s,transform .35s,border-color .35s}
.rl .points li.on{opacity:1;transform:none}
.rl .points li.now{border-color:var(--amber)}
.rl .points .k{font-family:var(--f-mono);font-weight:500;font-size:.78rem;color:var(--amber);min-width:3.4em;padding-top:2px;direction:ltr;unicode-bidi:isolate;text-align:start}
.rl .pearl{padding:11px 14px;border-inline-start:3px solid var(--teal);background:var(--teal-soft);border-radius:10px;font-size:.92rem;opacity:.18;transition:opacity .4s}
.rl .pearl.on{opacity:1}
.rl .pearl .tag{font-size:.72rem;font-weight:700;color:var(--teal);display:block}
.rl .visual{min-width:0;min-height:0;position:relative;background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex}
.rl .visual svg{width:100%;height:100%;display:block;flex:1;min-height:0}
.rl .vcap{position:absolute;inset-inline-end:14px;bottom:10px;font-size:.72rem;color:var(--muted)}
.rl .vtools{position:absolute;top:12px;inset-inline-start:12px;display:flex;gap:6px;flex-wrap:wrap;max-width:75%}
.rl svg text{font-family:var(--f);fill:var(--ink)}
.rl svg .mono{font-family:var(--f-mono)}
.rl svg .disp{font-weight:800}
.rl svg .mut{fill:var(--muted)}
.rl .dock{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding-top:8px;border-top:1px solid var(--line)}
.rl .pbtn{width:42px;height:42px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);display:grid;place-items:center;cursor:pointer}
.rl .pbtn svg{width:16px;height:16px;fill:currentColor}
.rl .track{position:relative;min-width:0}
.rl .segs{display:flex;gap:3px;height:30px}
.rl .seg{flex:1;min-width:0;position:relative;background:var(--line);border-radius:4px;overflow:hidden}
.rl .seg i{position:absolute;inset-block:0;inset-inline-start:0;width:0;background:var(--amber-soft)}
.rl .seg i::after{content:"";position:absolute;inset-inline:0;bottom:0;height:4px;background:var(--amber)}
.rl .seg span{position:absolute;inset-inline:6px 4px;top:50%;transform:translateY(-50%);font-size:.68rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.rl .seg.cur{outline:1.5px solid var(--ink);outline-offset:1px}
.rl .track input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:ew-resize;margin:0}
.rl .time{font-size:.78rem;color:var(--muted);white-space:nowrap}
@media (max-width:820px){
  .rl{height:auto;min-height:0}
  .rl .stage{grid-template-columns:minmax(0,1fr)}
  .rl .visual{order:-1;height:min(58vh,420px)}
  .rl .copy{overflow:visible}
  .rl .seg span{display:none}
  .rl .dock{position:sticky;bottom:0;background:var(--bg);padding-bottom:max(10px,env(safe-area-inset-bottom,0px))}
}
@media (prefers-reduced-motion:reduce){.rl .points li,.rl .pearl{transition:none}}
</style>
