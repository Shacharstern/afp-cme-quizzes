<script>
/* Topic-specific reel scenes: potassium and sodium (AFP 2023 x2). Text comes from the pack; drawing lives here. */
(()=>{
const {S,set,lerp,ease,span,C,R,M,wrap,lines}=REEL.kit;
const N=(x,y,text,o={},p)=>S('text',Object.assign({x,y,text,direction:'ltr','text-anchor':'middle'},o),p); // numbers
const kfmt=v=>v.toFixed(1);

/* ECG beat generator: P, QRS, T on a baseline */
function ecgPath(x0,x1,base,o){let d='M'+x0+' '+base,x=x0+20;while(x<x1-60){
  if(o.p>0)d+=' L'+x+' '+base+' Q'+(x+9)+' '+(base-o.p*2)+' '+(x+18)+' '+base;x+=26;
  const q=o.qrs;d+=' L'+x+' '+base+' L'+(x+q*.25)+' '+(base+10)+' L'+(x+q*.5)+' '+(base-70)+' L'+(x+q*.8)+' '+(base+18)+' L'+(x+q)+' '+base;x+=q+22;
  d+=' Q'+(x+18)+' '+(base-o.t*2)+' '+(x+36)+' '+base;x+=36;d+=' L'+(x+o.gap)+' '+base;x+=o.gap;}
  return d+' L'+x1+' '+base;}

REEL.custom('lytes',{
 ucurve(g,d){ // U-shaped mortality vs potassium
  const X=k=>60+(k-2)/5*500,Y=k=>{const r=Math.min(6.25,(k-4.5)*(k-4.5));return 370-r/6.25*250;};
  S('rect',{x:X(3.5),y:90,width:X(5)-X(3.5),height:290,fill:C('teal-soft')},g);
  S('rect',{x:X(4),y:90,width:X(5)-X(4),height:290,fill:C('ok-soft'),opacity:.9},g);
  M((X(4)+X(5))/2,108,d.sweet||'4–5',{'font-size':'11px','font-weight':'700',fill:C('ok')},g);
  M((X(3.5)+X(5))/2,396,d.normal||'3.5–5.0',{'font-size':'11px',fill:C('teal')},g);
  [2,3,4,5,6,7].forEach(k=>{S('line',{x1:X(k),y1:380,x2:X(k),y2:386,stroke:C('muted')},g);N(X(k),418,String(k),{class:'mono mut','font-size':'11px'},g);});
  S('line',{x1:60,y1:380,x2:560,y2:380,stroke:C('muted'),'stroke-width':'1.5px'},g);
  R(580,436,d.axis||'',{'font-size':'11px',class:'mut'},g);
  let p='';for(let k=2;k<=7.001;k+=.05)p+=(p?' L':'M')+X(k)+' '+Y(k);
  S('path',{d:p,fill:'none',stroke:C('line'),'stroke-width':'3px'},g);
  const live=S('path',{d:p,fill:'none',stroke:C('rose'),'stroke-width':'4px',pathLength:1,'stroke-dasharray':'1','stroke-dashoffset':'1'},g);
  const dot=S('circle',{r:9,fill:C('amber'),stroke:C('bg'),'stroke-width':'3px'},g),val=N(0,0,'',{class:'disp','font-size':'20px',fill:C('ink')},g);
  const lo=S('g',{},g);R(250,150,d.left.v,{class:'disp','font-size':'24px',fill:C('rose')},lo);R(250,170,d.left.l,{'font-size':'11.5px',class:'mut'},lo);
  const hi=S('g',{},g);R(450,130,d.right.v,{class:'disp','font-size':'24px',fill:C('rose')},hi);R(450,150,d.right.l,{'font-size':'11.5px',class:'mut'},hi);
  const top=S('g',{},g);(d.chips||[]).forEach((c,i)=>{R(580-i*190,40,c.v,{class:'disp','font-size':'20px',fill:C(c.tone||'teal')},top);R(580-i*190,60,c.l,{'font-size':'11px',class:'mut'},top);});
  return t=>{const u=span(t,.05,.8),k=lerp(2.2,6.9,u);set(live,{'stroke-dashoffset':1-u});set(dot,{cx:X(k),cy:Y(k)});set(val,{x:X(k),y:Y(k)-18,text:kfmt(k)});
   val.style.fill=k<3.5||k>5?C('rose'):k>=4&&k<=5?C('ok'):C('teal');lo.style.opacity=span(t,.12,.2);hi.style.opacity=span(t,.62,.7);top.style.opacity=span(t,.82,.9);};
 },
 shift(g,d){ // potassium moves into or out of cells
  const cx=210,cy=225,r=125;S('circle',{cx,cy,r,fill:C('amber-soft'),stroke:C('amber'),'stroke-width':'5px'},g);M(cx,cy-r+28,d.cell||'תא',{'font-size':'12px','font-weight':'700',fill:C('amber')},g);
  const rnd=i=>{const a=(i*137.5)%360*Math.PI/180,q=((i*53)%100)/100;return a+q;};
  const dots=[];for(let i=0;i<26;i++){const a=rnd(i),ri=25+((i*37)%70),ro=r+30+((i*29)%34);dots.push({e:S('g',{},g),in:[cx+Math.cos(a)*ri,cy+Math.sin(a)*ri],out:[cx+Math.cos(a)*ro,cy+Math.sin(a)*ro],grp:i<13?0:1});}
  dots.forEach(o=>{S('circle',{r:9,fill:C('teal')},o.e);N(0,4,'K⁺',{'font-size':'9px','font-weight':'700',fill:C('bg')},o.e);});
  const mx=30,mt=60,mb=400,MY=k=>mb-(k-2)/6*(mb-mt);S('rect',{x:mx,y:mt,width:18,height:mb-mt,rx:9,fill:C('line')},g);
  S('rect',{x:mx-4,y:MY(5),width:26,height:MY(3.5)-MY(5),rx:4,fill:'none',stroke:C('ok'),'stroke-width':'2px','stroke-dasharray':'3 3'},g);
  const lvl=S('rect',{x:mx+3,y:0,width:12,height:0,rx:6,fill:C('rose')},g),kv=N(mx+9,mt-14,'',{class:'disp','font-size':'16px'},g);M(mx+9,mb+20,d.serum||'אשלגן בדם',{'font-size':'10px',class:'mut'},g);
  const L=S('g',{},g),Rr=S('g',{},g);
  R(580,70,d.inn.h,{'font-size':'15px','font-weight':'700',fill:C('teal')},L);d.inn.items.forEach((x,i)=>R(580,96+i*21,'← '+x,{'font-size':'12.5px'},L));R(580,96+d.inn.items.length*21+6,d.inn.out,{'font-size':'12.5px','font-weight':'700',fill:C('teal')},L);
  R(580,250,d.out.h,{'font-size':'15px','font-weight':'700',fill:C('rose')},Rr);d.out.items.forEach((x,i)=>R(580,276+i*20,'→ '+x,{'font-size':'12.5px'},Rr));R(580,276+d.out.items.length*20+6,d.out.out,{'font-size':'12.5px','font-weight':'700',fill:C('rose')},Rr);
  return t=>{const p1=span(t,.06,.42),p2=span(t,.54,.9);
   dots.forEach(o=>{const f=o.grp===0?1-p1:p2;const x=lerp(o.in[0],o.out[0],f),y=lerp(o.in[1],o.out[1],f);o.e.setAttribute('transform','translate('+x+' '+y+')');});
   const kk=t<.5?4.2-1.2*p1:3.0+3.0*p2;
   set(lvl,{y:MY(kk),height:mb-MY(kk),fill:kk<3.5||kk>5?C('rose'):C('teal')});set(kv,{text:kfmt(kk)});
   L.style.opacity=t<.5?1:.25;Rr.style.opacity=t<.5?.15:1;};
 },
 ecg(g,d){ // ECG morphs as potassium moves away from normal
  const x0=20,x1=580,base=200;S('rect',{x:x0,y:70,width:x1-x0,height:200,rx:10,fill:C('rose-soft'),opacity:.35},g);
  for(let x=x0;x<=x1;x+=20)S('line',{x1:x,y1:70,x2:x,y2:270,stroke:C('rose'),opacity:.12},g);for(let y=70;y<=270;y+=20)S('line',{x1:x0,y1:y,x2:x1,y2:y,stroke:C('rose'),opacity:.12},g);
  const tr=S('path',{d:'',fill:'none',stroke:C('ink'),'stroke-width':'2.5px','stroke-linejoin':'round'},g);
  R(580,40,d.title,{'font-size':'15px','font-weight':'700'},g);const kv=N(60,44,'',{class:'disp','font-size':'26px'},g);
  const marks=(d.marks||[]).map((m,i)=>{const gg=S('g',{},g),y=300+i*30;S('circle',{cx:568,cy:y-4,r:6,fill:C(m.tone||'rose')},gg);R(554,y,m.t,{'font-size':'13px','font-weight':'700'},gg);if(m.s)R(554-Math.min(330,m.t.length*7.4)-14,y,m.s,{'font-size':'11.5px',class:'mut'},gg);gg.style.opacity=.15;return {gg,m};});
  const note=d.note?R(580,300+(d.marks||[]).length*30+8,d.note,{'font-size':'12px',fill:C('rose'),'font-weight':'700'},g):null;
  return t=>{const u=span(t,.05,.8),k=lerp(d.from,d.to,u);let o;
   if(d.mode==='hypo')o={p:8,qrs:14,t:lerp(18,3,u),gap:lerp(70,70,u)};else o={p:u>.65?0:8*(1-u/.65),qrs:lerp(14,40,u),t:16,gap:lerp(60,130,u)};
   tr.setAttribute('d',ecgPath(x0,x1,base,o));kv.textContent='K '+kfmt(k);kv.style.fill=(k<3.5||k>5)?C('rose'):C('ink');
   marks.forEach(x=>x.gg.style.opacity=u>=x.m.at?1:.15);if(note)note.style.opacity=span(t,.82,.9);};
 },
 drip(g,d){ // IV vs oral replacement, each 10 mEq lifts serum K by about 0.1
  const lane=(x,title,lines_,tone)=>{const gg=S('g',{},g);S('rect',{x:x-250,y:20,width:250,height:250,rx:14,fill:C('bg'),stroke:C(tone),'stroke-width':'2px'},gg);R(x-14,46,title,{'font-size':'15px','font-weight':'800',fill:C(tone)},gg);lines_.forEach((l,i)=>R(x-14,70+i*19,l,{'font-size':'11.5px'},gg));return gg;};
  const iv=lane(580,d.iv.h,d.iv.lines,'rose'),po=lane(290,d.po.h,d.po.lines,'teal');
  const bag=S('g',{},g);S('rect',{x:470,y:170,width:50,height:70,rx:10,fill:C('rose-soft'),stroke:C('rose'),'stroke-width':'2px'},bag);N(495,212,'KCl',{'font-size':'12px','font-weight':'700'},bag);S('line',{x1:495,y1:240,x2:495,y2:262,stroke:C('rose'),'stroke-width':'2px'},bag);
  const drops=[0,1,2].map(()=>S('circle',{r:4,fill:C('rose'),cx:495},g));
  const cup=S('g',{},g);S('path',{d:'M180 180 L230 180 L224 250 L186 250Z',fill:C('teal-soft'),stroke:C('teal'),'stroke-width':'2px'},cup);
  const pills=[0,1,2].map(i=>S('ellipse',{rx:9,ry:5,fill:C('teal'),cx:196+i*9},g));
  const Xk=k=>40+(k-2)/2*520;S('line',{x1:40,y1:330,x2:560,y2:330,stroke:C('line'),'stroke-width':'12px','stroke-linecap':'round'},g);
  [2,2.5,3,3.5,4].forEach(k=>N(Xk(k),356,String(k),{class:'mono mut','font-size':'11px'},g));S('rect',{x:Xk(3.5),y:322,width:Xk(4)-Xk(3.5),height:16,rx:4,fill:C('ok'),opacity:.3},g);
  const mk=S('circle',{r:10,fill:C('amber'),cy:330},g),kv=N(0,312,'',{class:'disp','font-size':'16px'},g),dose=R(580,392,'',{'font-size':'14px','font-weight':'700'},g);R(580,418,d.rule||'',{'font-size':'12px',class:'mut'},g);
  return t=>{const a=span(t,.04,.44),b=span(t,.54,.9);const k=t<.5?2.3+.5*a:2.8+.8*b;set(mk,{cx:Xk(k)});set(kv,{x:Xk(k),text:kfmt(k)});
   iv.style.opacity=t<.5?1:.35;po.style.opacity=t<.5?.35:1;dose.textContent=t<.5?'IV: '+Math.round(50*a)+' mEq ניתנו':'דרך הפה: '+Math.round(80*b)+' mEq ניתנו';
   drops.forEach((e,i)=>{const f=((t*30)+i/3)%1;set(e,{cy:250+f*14,opacity:t<.5&&a<1?1-f:0});});pills.forEach((e,i)=>{const f=((t*20)+i/3)%1;set(e,{cy:150+f*80,opacity:t>=.5&&b<1?1-f:0});});};
 },
 fork(g,d){ // urine potassium splits the workup
  R(580,36,d.title,{'font-size':'15px','font-weight':'700'},g);
  const X=v=>560-v/40*500;S('line',{x1:X(0),y1:110,x2:X(40),y2:110,stroke:C('line'),'stroke-width':'12px','stroke-linecap':'round'},g);
  [0,10,15,20,30,40].forEach(v=>N(X(v),136,String(v),{class:'mono mut','font-size':'11px'},g));S('line',{x1:X(15),y1:90,x2:X(15),y2:130,stroke:C('ink'),'stroke-width':'2px','stroke-dasharray':'4 3'},g);
  const nd=S('path',{d:'M-9 -24 L9 -24 L0 -10Z',fill:C('ink')},g),uv=N(60,80,'',{class:'disp','font-size':'22px'},g);
  const box=(x,b,tone)=>{const gg=S('g',{},g);const r=S('rect',{x:x-270,y:160,width:270,height:190,rx:14,fill:C('bg'),stroke:C('line'),'stroke-width':'2px'},gg);R(x-14,188,b.h,{'font-size':'14px','font-weight':'800',fill:C(tone)},gg);b.lines.forEach((l,i)=>R(x-14,212+i*20,l,{'font-size':'12px'},gg));return {gg,r,tone};};
  const A=box(580,d.low,'teal'),B=box(290,d.high,'rose');
  const mg=S('g',{},g);S('rect',{x:20,y:368,width:560,height:40,rx:20,fill:C('amber-soft'),stroke:C('amber')},mg);M(300,394,d.mg,{'font-size':'13px','font-weight':'700'},mg);
  return t=>{const v=lerp(5,35,span(t,.05,.7));nd.setAttribute('transform','translate('+X(v)+' 110)');uv.textContent=Math.round(v)+' mEq/L';
   const lo=v<=15;[A,B].forEach((o,i)=>{const on=i===0?lo:!lo;set(o.r,{stroke:on||t>.72?C(o.tone):C('line'),'stroke-width':on?'3px':'2px'});o.gg.style.opacity=on||t>.72?1:.35;});mg.style.opacity=span(t,.78,.86);};
 },
 pseudo(g,d){ // false high potassium, then the drugs that block excretion
  const tube=S('g',{},g);S('rect',{x:440,y:40,width:60,height:200,rx:28,fill:C('bg'),stroke:C('muted'),'stroke-width':'2px'},tube);
  const blood=S('rect',{x:444,y:90,width:52,height:146,rx:24,fill:C('rose')},tube);const leak=[0,1,2,3,4].map(i=>N(470,0,'K⁺',{'font-size':'11px','font-weight':'800',fill:C('amber')},tube));
  R(580,30,d.tubeTitle,{'font-size':'14px','font-weight':'800'},g);
  const items=d.items.map((x,i)=>{const e=R(430,70+i*22,'• '+x,{'font-size':'12px'},g);e.style.opacity=.15;return e;});
  const fix=S('g',{},g);S('rect',{x:300,y:250,width:280,height:34,rx:17,fill:C('teal')},fix);M(440,272,d.fix,{'font-size':'12.5px','font-weight':'700',fill:C('bg')},fix);
  const kid=S('g',{},g);S('path',{d:'M110 300 C60 300 50 360 80 390 C100 410 140 405 150 380 C140 360 140 330 150 315 C140 302 125 300 110 300Z',fill:C('rose-soft'),stroke:C('rose'),'stroke-width':'3px'},kid);
  const stop=S('g',{},kid);S('circle',{cx:160,cy:350,r:14,fill:C('rose')},stop);S('rect',{x:152,y:347,width:16,height:6,fill:C('bg')},stop);
  R(580,312,d.drugTitle,{'font-size':'14px','font-weight':'800'},g);const drugs=d.drugs.map((x,i)=>{const col=i%2,row=Math.floor(i/2);const e=R(580-col*200,336+row*20,'• '+x,{'font-size':'12px'},g);e.style.opacity=.12;return e;});
  return t=>{const h=span(t,.05,.35);set(blood,{fill:h>.5?C('rose-soft'):C('rose')});leak.forEach((e,i)=>set(e,{x:452+i*9,y:220-h*(40+i*28),opacity:h*(1-i*.12)}));
   items.forEach((e,i)=>e.style.opacity=t>=.08+i*.06?1:.15);fix.style.opacity=span(t,.42,.5);kid.style.opacity=.3+.7*span(t,.52,.6);stop.style.opacity=span(t,.6,.66);
   drugs.forEach((e,i)=>e.style.opacity=t>=.58+i*.035?1:.12);};
 }
});
})();
</script>
