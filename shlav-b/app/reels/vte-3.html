<script>
/* DVT and PE reel scenes, part 3 (Goroll ch. 35): superficial vein thrombosis, and where the clot sits. */
(()=>{

  S('path',{d:'M411 330 Q392 342 400 356 Q410 370 392 382 Q378 392 388 404',fill:'none',stroke:C('amber'),'stroke-width':'4px',opacity:.8},g);

  const H=(d.spots||[]).map(s=>{const e=S('g',{},g),r=s.side==='r',cx=r?592:8,w=226,x=r?cx-w:cx,cy=s.cy;

   R(x+w-12,cy-hh/2+24,s.v,{class:'disp','font-size':'17px',fill:C(s.tone||'ink')},e);L.forEach((l,j)=>R(x+w-12,cy-hh/2+44+j*16,l,{'font-size':'11px'},e));

  return t=>{H.forEach(o=>{const v=span(t,o.at-.02,o.at+.06);op(o.e,v);set(o.dot,{r:9+3*Math.sin(t*40)*(v>.9?1:0)});});};

});
})();
</script>
