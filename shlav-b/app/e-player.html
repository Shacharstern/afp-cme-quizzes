<script>

/* --- summary --- */
function runSummary(id){

/* --- drills (no timer) --- */

      card.append(h('div',{class:'fb '+(res==='right'?'good':res==='close'?'close':'bad')},h('div',{class:'row'},h('span',{class:'h'},res==='right'?'נכון!':res==='close'?'קרוב':'לא הפעם'),res!=='right'?h('span',{class:'note'},'ענית: '+label+' · התשובה: '+ans):null,h('span',{class:'sp'}),nb),h('div',{},it.w)));

/* --- pathway cases --- */

      const btns=order2.map((oi,pos)=>h('button',{class:'opt',onclick:()=>ch(pos)},h('kbd',{},pos+1),h('span',{},s.o[oi])));
      card.append(h('div',{},h('b',{},c.name+', '+c.age),h('div',{},c.story)),week(good),h('div',{class:'row'},h('span',{class:'lbl',style:'color:var(--teal)'},'תחנה '+(k+1)),h('b',{},S0.t)),h('p',{class:'q'},s.q),h('div',{class:'opts'},btns));
      body.replaceChildren(h('div',{class:'note'},'מטופלת '+(C.ci+1)+' מתוך '+order.length),railEl(SN,states),card);

  box.append(h('div',{class:'card'},h('div',{},'הבוחן שואל, אתם עונים בקול מהזיכרון. אחר כך הופכים את נקודות המפתח ומסמנים בכנות: אמרתי, חלקית או פספסתי. אחרי כל תשובה מגיעה שאלת המשך, וכל מה שפספסתם חוזר בחזרה המרווחת.')),
    h('div',{class:'modes'},p.oral.map(s=>{const c=s.q.reduce((a,q)=>a+(pk.oral[q.id]||0),0)/s.q.length;return h('button',{class:'mode',onclick:()=>runOral(id,s.id)},h('b',{},s.t),h('span',{class:'note'},s.d),h('div',{class:'meter'},h('i',{style:'width:'+Math.round(c*100)+'%'})),h('span',{class:'note'},'כיסוי מיטבי '+Math.round(c*100)+'%'));})));}

function runReview(id){const X=oralIndex(id),sr=PK(id).sr,now=Date.now(),by={};for(const k in sr){const e=sr[k];if(e.due<=now&&X[e.q])(by[e.q]=by[e.q]||[]).push(e.i);}
  const q=shuffle(Object.keys(by)).slice(0,6).map(k=>({...X[k],hide:by[k].sort((a,b)=>a-b),review:true}));if(!q.length){toast('אין כרגע נקודות לחזרה');return;}PLAYER.id=id;oralFlow(id,'חזרה מרווחת',q,true);}
function startGlobalReview(){const ids=Object.keys(S.packs).filter(id=>PACKS[id]&&srKeyCount(id)[0]);if(!ids.length){toast('אין כרגע נקודות לחזרה');return;}location.hash='t-'+ids[0];setTimeout(()=>runReview(ids[0]),30);}
function srMark(pk,item,idx,v){const key=item.key+'#'+idx,e=pk.sr[key];

function oralFlow(id,title,queue,review){
  ac();const pk=PK(id),X=oralIndex(id);const O={i:0,said:0,total:0,full:0,locked:0,added:0,missed:[]};
  const box=stage((review?'':'בעל פה · ')+title);const body=h('div',{class:'play'});box.append(body);let clk=0;

    body.replaceChildren(h('div',{class:'pcard'},h('div',{class:'exr'},examiner(it.fu&&!it.review?'down':'flat'),h('div',{class:'bubble'},it.fu&&!it.review?h('span',{class:'press'},'ואם...?'):null,h('span',{class:'kind'},kind),it.q)),
      h('div',{class:'row'},clock,h('span',{class:'note',style:'flex:1;min-width:12em'},it.review?'הנקודות שכבר אמרתם גלויות. השלימו בקול את '+nh+' החסרות.':'ענו בקול, במשפטים מלאים. '+nh+' נקודות מפתח מוסתרות. אין מגבלת זמן.')),
      h('div',{class:'play',style:'gap:8px'},it.p.map((p,i)=>isHid(it,i)?h('div',{class:'kp hid'},h('span',{class:'n'},i+1),h('span',{class:'tx'},'• • • • •')):h('div',{class:'kp ctx'},h('span',{class:'n'},i+1),h('span',{},p)))),

    const foot=h('div');
    body.replaceChildren(h('div',{class:'pcard'},h('div',{class:'exr'},face,h('div',{class:'bubble'},h('span',{class:'kind'},'דיברתם '+Math.floor(secs/60)+':'+pad2(secs%60)+' · היו כנים'),'אמרתם את זה? הפכו כל נקודה.')),h('div',{class:'play',style:'gap:8px'},rows),foot));
    let j=0,said=0,full=0;const miss=[];
    function reveal(){if(j>=order.length)return verdict();const r=rows[order[j]];r.className='kp cur';r.children[1].textContent=it.p[order[j]];SFX.tap();
      r.append(h('div',{class:'judge'},h('button',{class:'y',onclick:()=>mark(1)},'אמרתי (1)'),h('button',{class:'p',onclick:()=>mark(.5)},'חלקית (2)'),h('button',{class:'x',onclick:()=>mark(0)},'פספסתי (3)')));r.scrollIntoView({block:'nearest'});}
    function mark(v){const idx=order[j],r=rows[idx];if(!r||!r.classList.contains('cur'))return;r.lastChild.remove();r.className='kp '+(v===1?'said':v>0?'part':'miss');said+=v;
      const res=srMark(pk,it,idx,v===1?1:0);if(res==='added')O.added++;

      const again=it.review?null:h('button',{class:'btn ghost small',onclick:()=>{O.said-=said;O.total-=n;if(complete)O.full--;if(miss.length)O.missed.pop();ask();}},'טייק שני');
