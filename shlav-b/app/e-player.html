<style>
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.mode{border:2px solid var(--line);background:var(--bg);border-radius:16px;padding:16px;text-align:start;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-width:0;transition:transform .15s,border-color .15s}
.mode:hover{border-color:var(--amber);transform:translateY(-2px)}
.mode b{font-size:1.25rem;font-weight:800}
.mode.reel{background:linear-gradient(135deg,var(--panel),var(--teal-soft));border-color:var(--teal)}
.mode.game{background:linear-gradient(135deg,var(--panel),var(--amber-soft));border-color:var(--amber)}
.mode .note{line-height:1.4}
.meter{height:6px;border-radius:3px;background:var(--line);overflow:hidden}.meter i{display:block;height:100%;background:var(--amber)}
.sum{display:flex;flex-direction:column;gap:12px}
.sum h3{font-size:1.05rem}
.sum ul{margin:0;padding-inline-start:1.2em;display:flex;flex-direction:column;gap:4px}
.pearl2{border-inline-start:3px solid var(--teal);background:var(--teal-soft);border-radius:10px;padding:8px 12px;font-size:.9rem}
@media (max-width:620px){.modes{grid-template-columns:minmax(0,1fr)}}
</style>
<script>
/* ---------- pack player: the reel and the game ---------- */
const PLAYER={active:false,id:null,keys:null};
function exitPlayer(){try{GAME.stop();}catch(e){}PLAYER.active=false;PLAYER.keys=null;location.hash='t-'+PLAYER.id;}
function stage(){PLAYER.active=true;if(location.hash!=='#p-'+PLAYER.id)history.replaceState(null,'','#p-'+PLAYER.id);const v=$('#view');v.innerHTML='';const box=h('section');v.append(box);window.scrollTo(0,0);return box;}
addEventListener('keydown',e=>{if(!PLAYER.active||!PLAYER.keys)return;const tg=e.target.tagName;if(tg==='INPUT'&&e.key.startsWith('Arrow'))return;if(tg==='TEXTAREA'||tg==='SELECT')return;if(tg==='BUTTON'&&(e.key==='Enter'||e.key===' ')&&!e.target.classList.contains('nx'))return;if(PLAYER.keys(e))e.preventDefault();});
function recordRecall(id,pct){T(id).rc={d:today(),pct:Math.round(pct)};}
const srKeyCount=id=>{const sr=(S.packs[id]||{}).sr||{},now=Date.now();let d=0,a=0;for(const k in sr){a++;if(sr[k].due<=now)d++;}return [d,a];};

function packCard(id){
  const p=PACKS[id];
  if(!p)return h('div',{class:'card'},h('h3',{},'חבילת לימוד'),h('div',{class:'empty'},'לנושא הזה עוד אין חבילה.'),
    h('div',{class:'note'},'כדי ליצור חבילה, פתחו סשן של Claude Code במאגר afp-cme-quizzes והקלידו ',h('span',{class:'num'},'/shlav-b-pack '+id),'. המנוע קורא את מקורות העוגן מתיקיית ״שלב א״ ב-Drive, כותב סרטון ומשחק בעברית ומעלה אותם לכאן. החבילה תופיע בדף הזה בלי לרענן.'));
  const pk=PK(id),drills=p.drills||[],mast=drills.filter(d=>((pk.box||{})[d.id]||0)>=3).length,stars=Object.values(pk.stars||{}).reduce((a,b)=>a+b,0);
  const [due,all]=srKeyCount(id),ch=(p.reel&&p.reel.chapters)||[];
  return h('div',{class:'card'},h('div',{class:'row'},h('h3',{},'חבילת לימוד'),h('span',{class:'sp'}),h('span',{class:'note'},p.sources.map(s=>s.kind+' '+s.year).join(' · '))),
    p.summary?h('div',{class:'note'},p.summary.oneLiner):null,
    h('div',{class:'modes'},
      ch.length?h('button',{class:'mode reel',onclick:()=>runReel(id)},h('span',{class:'lbl',style:'color:var(--teal)'},'▶ לצפות ולגלול'),h('b',{},'סרטון אינטראקטיבי'),h('span',{class:'note'},ch.length+' פרקים עם אנימציות: '+ch.slice(0,4).map(c=>c.label).join(' · ')+(ch.length>4?' …':''))):null,
      h('button',{class:'mode game',onclick:()=>runGame(id)},h('span',{class:'lbl',style:'color:var(--amber)'},'לשחק ולהיבחן'),h('b',{},'המשחק'),
        h('span',{class:'note'},[drills.length?'משמרות עם לבבות וקומבו':null,p.pathway?'מסלול מקרים':null,p.oral?'בחינה בעל פה עם שאלות המשך':null].filter(Boolean).join(' · ')),
        drills.length?h('div',{class:'meter'},h('i',{style:'width:'+Math.round(mast/drills.length*100)+'%'})):null,
        h('span',{class:'note'},mast+'/'+drills.length+' עובדות ננעלו · '+stars+' כוכבים'))),
    h('div',{class:'row'},p.summary?h('button',{class:'btn small ghost',onclick:()=>runSummary(id)},'דף סיכום'):null,h('span',{class:'sp'}),
      all?h('span',{class:'note'},'חזרה מרווחת: '+due+' עכשיו · '+(all-due)+' ממתינות · '+(pk.srDone||0)+' ננעלו'):null,
      due?h('button',{class:'btn rose small',onclick:()=>runGame(id,'review')},'סבב חזרה'):null));
}
function runReel(id){PLAYER.id=id;const box=stage();REEL.mount(box,PACKS[id],exitPlayer);}
function runGame(id,start){PLAYER.id=id;const box=stage();GAME.open(box,id,exitPlayer,start);}
function runSummary(id){
  PLAYER.id=id;const p=PACKS[id],box=stage();PLAYER.keys=null;const s=h('div',{class:'sum'});box.append(s);
  s.append(h('div',{class:'row'},h('button',{class:'btn small ghost',onclick:exitPlayer},'→ חזרה לנושא'),h('b',{},'דף סיכום · '+TOPIC[id].name)));
  s.append(h('div',{class:'card'},h('div',{style:'font-weight:600'},p.summary.oneLiner),h('div',{class:'note'},'מקורות: '+p.sources.map(x=>x.label).join(' · '))));
  p.summary.sections.forEach(x=>s.append(h('div',{class:'card'},h('h3',{},x.h),h('ul',{},x.points.map(y=>h('li',{},y))),x.pearl?h('div',{class:'pearl2'},h('b',{},'פנינה: '),x.pearl):null)));
  const t=T(id);if(t.s===0)s.append(h('div',{class:'row'},h('button',{class:'btn',onclick:()=>{t.s=1;t.next=addDays(today(),3);save();toast('סומן ״קראתי״. חזרה ב-'+fmtD(t.next));exitPlayer();}},'סיימתי לקרוא · סמן ״קראתי״')));
}
function startGlobalReview(){const ids=Object.keys(S.packs).filter(id=>PACKS[id]&&srKeyCount(id)[0]);if(!ids.length){toast('אין כרגע נקודות לחזרה');return;}runGame(ids[0],'review');}

/* ---------- start ---------- */
document.body.append(fx);sizeFx();addEventListener('resize',sizeFx);
route();boot();
</script>
