<script>
/* ---------- spaced repetition: one store for every topic ----------
   Cards: d|pack|drillId (fact drill), c|pack|caseId|step (case decision), o|pack|questionKey|point (oral key point).
   Each card is [box, dueDay, lapses]. Boxes 1..6 wait 1, 3, 7, 16, 35, 60 days; box 6 = mastered.
   A card enters when it is first answered: right starts at box 2 (3 days), anything else at box 1. */
const SRS=(()=>{
const INT=[0,1,3,7,16,35,60];
const dayN=(d=new Date())=>Math.floor((d.getTime()-d.getTimezoneOffset()*60000)/86400000);
const dayIso=n=>{const d=new Date(n*86400000);return iso(new Date(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate()));};
const parse=k=>{const a=k.split('|');return {t:a[0],p:a[1],id:a[2],i:a[3]==null?null:+a[3]};};
function st(){
  if(!S.srs)S.srs={v:1,c:{},day:{n:0,done:0,nw:0},cfg:{}};
  const s=S.srs;s.c=s.c||{};s.cfg=Object.assign({cap:40,newCap:20,exam:true},s.cfg||{});
  if(!s.day||s.day.n!==dayN())s.day={n:dayN(),done:0,nw:0};
  if(!s.mig){ // carry the older oral-only repetition into the shared store
    for(const id in S.packs){const sr=(S.packs[id]||{}).sr||{};for(const k in sr){const e=sr[k];if(e&&e.q!=null)s.c['o|'+id+'|'+e.q+'|'+e.i]=[e.streak>0?2:1,dayN(new Date(e.due||Date.now())),0];}if(S.packs[id])S.packs[id].sr={};}
    s.mig=1;}
  return s;}
function ivl(box){
  let iv=INT[box];const c=st().cfg;
  if(c.exam&&S.examDate){const left=daysBetween(today(),S.examDate);
    if(left>0){iv=Math.min(iv,Math.max(1,left-3));if(left<=30)iv=Math.min(iv,Math.max(1,Math.round(left/3)));}}
  return iv;}
function oralItem(P,qk){for(const s of P.oral||[])for(const q of s.q){
  if(q.id===qk)return {key:q.id,k:q.k,q:q.q,f:q.f,p:q.p,st:s.t};
  if(q.fu&&q.id+'F'===qk)return {key:qk,k:'שאלת המשך',q:q.fu.q,f:q.fu.f,p:q.fu.p,st:s.t,fu:true};}return null;}
function exists(q){const P=PACKS[q.p];if(!P)return false;
  if(q.t==='d')return (P.drills||[]).some(d=>d.id===q.id);
  if(q.t==='c'){const c=((P.pathway||{}).cases||[]).find(c=>c.id===q.id);return !!(c&&c.steps[q.i]);}
  if(q.t==='o'){const o=oralItem(P,q.id);return !!(o&&o.p[q.i]!=null);}
  return false;}
const tierRank=p=>{const t=TOPIC[p];return t?({A:0,B:1,C:2}[t.tier]??3):3;};
function grade(key,res){ // res: right | close | part | wrong
  const s=st(),e=s.c[key],isNew=!e,prev=e?e[0]:0;let box;
  if(res==='right')box=isNew?2:Math.min(6,prev+1);
  else if(res==='close')box=isNew?1:prev;
  else if(res==='part')box=isNew?1:Math.max(1,prev-1);
  else box=1;
  const iv=ivl(box);s.c[key]=[box,dayN()+iv,(e?e[2]:0)+(res==='wrong'?1:0)];
  syncTopic(key.split('|')[1]);
  return {box,prev,isNew,iv,mastered:box===6&&prev<6};}
const boxOf=k=>{const e=st().c[k];return e?e[0]:0;};
function each(scope,fn){const s=st();for(const k in s.c){const q=parse(k);if(scope&&q.p!==scope)continue;if(!PACKS[q.p]||!exists(q))continue;fn(k,s.c[k],q);}}
function counts(scope){const r={d:0,c:0,o:0,all:0,total:0,mastered:0},n=dayN();
  each(scope,(k,e,q)=>{r.total++;if(e[0]>=6)r.mastered++;if(e[1]<=n){r[q.t]++;r.all++;}});return r;}
function forecast(scope,days=7){const out=Array(days).fill(0),n=dayN();each(scope,(k,e)=>{const d=Math.max(0,e[1]-n);if(d<days)out[d]++;});return out;}
function byTopic(){const m={},n=dayN();each(null,(k,e,q)=>{if(e[1]<=n)m[q.p]=(m[q.p]||0)+1;});return Object.entries(m).sort((a,b)=>tierRank(a[0])-tierRank(b[0])||b[1]-a[1]);}
function newPool(scope){ // drills never answered, from topics already started
  const s=st(),started=new Set();for(const k in s.c)started.add(k.split('|')[1]);
  const out=[];(scope?[scope]:[...started]).forEach(p=>{const P=PACKS[p];if(!P)return;(P.drills||[]).forEach(d=>{const k='d|'+p+'|'+d.id;if(!s.c[k])out.push(k);});});return out;}
function plan(scope){
  const s=st(),n=dayN(),due=[];each(scope,(k,e)=>{if(e[1]<=n)due.push(k);});
  due.sort((a,b)=>s.c[a][1]-s.c[b][1]||tierRank(parse(a).p)-tierRank(parse(b).p));
  const room=Math.max(0,s.cfg.cap-s.day.done),take=due.slice(0,room);
  const nroom=Math.max(0,Math.min(s.cfg.newCap-s.day.nw,room-take.length));
  const fresh=shuffle(newPool(scope)).sort((a,b)=>tierRank(parse(a).p)-tierRank(parse(b).p)).slice(0,nroom);
  return {due:take,fresh,left:due.length-take.length,room};}
function tick(isNew){const s=st();s.day.done++;if(isNew)s.day.nw++;}
function syncTopic(p){ // the topic status and its review date follow the cards
  const P=PACKS[p];if(!P||!TOPIC[p])return;const s=st();
  const items=[...(P.drills||[]).map(d=>'d|'+p+'|'+d.id),...(((P.pathway||{}).cases)||[]).flatMap(c=>c.steps.map((_,i)=>'c|'+p+'|'+c.id+'|'+i))];
  if(items.length){const seen=items.filter(k=>s.c[k]).length,b4=items.filter(k=>boxOf(k)>=4).length,b2=items.filter(k=>boxOf(k)>=2).length;
    const lvl=b4>=items.length*.8?3:b2>=items.length*.5?2:seen?1:0;const t=T(p);if(lvl>t.s)t.s=lvl;}
  let min=null;for(const k in s.c){if(k.split('|')[1]!==p)continue;const d=s.c[k][1];if(min==null||d<min)min=d;}
  if(min!=null)T(p).next=dayIso(min);}
return {INT,dayN,dayIso,parse,st,grade,boxOf,counts,forecast,byTopic,plan,tick,oralItem,ivl,tierRank,exists};
})();
</script>
